<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dino Shooter 67 - GAZAN EDITION</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0f0; 
            font-size: 24px; text-shadow: 2px 2px #000; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid #0f0; border-radius: 50%; transform: translate(-50%, -50%);
        }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; background: rgba(0,0,0,0.8); padding: 20px; text-align: center;
            cursor: pointer; border: 3px solid #0f0;
        }
    </style>
</head>
<body>

    <div id="ui">
        Игрок: <b>Спецназ 67</b><br>
        Цель: Уничтожить Газана<br>
        Счёт: <span id="score">0</span>
    </div>
    <div id="crosshair"></div>
    <div id="instructions">
        <h1>🦖 DINO SHOOTER 67 🦖</h1>
        <p>Управление: WASD - ходить, МЫШЬ - смотреть, КЛИК - стрелять</p>
        <p><b>КЛИКНИ ТУТ, ЧТОБЫ НАЧАТЬ ИГРУ</b></p>
    </div>

    <!-- Подключаем движок Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let score = 0;
        let dinosaurs = [];

        const instructions = document.getElementById('instructions');

        // Инициализация игры
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x223322);
            scene.fog = new THREE.Fog(0x223322, 0, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            scene.add(light);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 10, 10);
            scene.add(dirLight);

            // Пол (Земля)
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshPhongMaterial({ color: 0x334433 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Управление камерой (Pointer Lock)
            document.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                instructions.style.display = document.pointerLockElement === document.body ? 'none' : 'block';
            });

            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveForward = true;
                if(e.code === 'KeyS') moveBackward = true;
                if(e.code === 'KeyA') moveLeft = true;
                if(e.code === 'KeyD') moveRight = true;
            });

            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveForward = false;
                if(e.code === 'KeyS') moveBackward = false;
                if(e.code === 'KeyA') moveLeft = false;
                if(e.code === 'KeyD') moveRight = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            document.addEventListener('mousedown', shoot);

            camera.position.y = 1.6;
            camera.rotation.order = 'YXZ';

            spawnDino();
            animate();
        }

        // Создание "Динозавра Газана" (сделан из блоков для простоты)
        function spawnDino() {
            const group = new THREE.Group();
            
            // Тело Газана
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 2), new THREE.MeshPhongMaterial({color: 0x44aa44}));
            body.position.y = 1;
            group.add(body);

            // Голова
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshPhongMaterial({color: 0x44aa44}));
            head.position.set(0, 1.8, 1);
            group.add(head);

            group.position.set(Math.random()*40-20, 0, Math.random()*40-20);
            scene.add(group);
            dinosaurs.push(group);

            setTimeout(spawnDino, 3000); // Новый Газан каждые 3 секунды
        }

        function shoot() {
            if (document.pointerLockElement !== document.body) return;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);

            const intersects = raycaster.intersectObjects(dinosaurs, true);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                while(hitObject.parent && !dinosaurs.includes(hitObject.parent)) {
                    hitObject = hitObject.parent;
                }
                
                scene.remove(hitObject);
                dinosaurs = dinosaurs.filter(d => d !== hitObject);
                score++;
                document.getElementById('score').innerText = score;
                console.log("Газан повержен!");
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (document.pointerLockElement === document.body) {
                const delta = 0.1;
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y = 1.6;
            }

            // Простая анимация динозавров (движение к игроку)
            dinosaurs.forEach(dino => {
                dino.lookAt(camera.position.x, 0, camera.position.z);
                dino.translateZ(0.03);
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
